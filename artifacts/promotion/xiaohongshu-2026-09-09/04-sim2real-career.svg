<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><style>text{font-family:'PingFang SC','Helvetica Neue','Arial',sans-serif}</style><rect x="0" y="0" width="1080" height="1440" rx="0" fill="#FAFAF3" stroke="none"/><rect x="72" y="57" width="12" height="26" rx="4" fill="#087C72" stroke="none"/><text x="102" y="79" font-size="22" fill="#173C3B" font-weight="600" >躺营 / ROBOT AGENT OS</text><text x="1008" y="79" font-size="22" fill="#647B77" font-weight="500" text-anchor="end">04 / 05</text><text x="72" y="190" font-size="72" fill="#173C3B" font-weight="650" >换一种机器人，</text><text x="72" y="286" font-size="70" fill="#087C72" font-weight="650" >保留上层任务逻辑。</text><text x="72" y="337" font-size="29" fill="#647B77" font-weight="400" >统一接口，让设备差异留在适配层。</text><rect x="72" y="378" width="936" height="104" rx="22" fill="#087C72" stroke="none"/><text x="540" y="423" font-size="38" fill="#FFFFFF" font-weight="650" text-anchor="middle">统一任务工具 / MCP</text><text x="540" y="460" font-size="25" fill="#D1ECE4" font-weight="400" text-anchor="middle">任务编排、状态查询与执行边界</text><path d="M540 493v22m-7-7 7 7 7-7" fill="none" stroke="#087C72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="72" y="529" width="936" height="106" rx="22" fill="#E5F2ED" stroke="none"/><text x="540" y="576" font-size="37" fill="#173C3B" font-weight="600" text-anchor="middle">设备 profile · 规范三维观测</text><text x="540" y="613" font-size="25" fill="#647B77" font-weight="400" text-anchor="middle">描述结构、能力、传感器来源与标定</text><path d="M540 635L540 672" fill="none" stroke="#087C72" stroke-width="2"/><path d="M220 672L860 672" fill="none" stroke="#087C72" stroke-width="2"/><path d="M220 672L220 694" fill="none" stroke="#087C72" stroke-width="2"/><rect x="72" y="694" width="296" height="156" rx="22" fill="#FFFFFF" stroke="#D7E5DF"/><text x="220" y="756" font-size="34" fill="#173C3B" font-weight="650" text-anchor="middle">MuJoCo</text><text x="220" y="806" font-size="28" fill="#087C72" font-weight="500" text-anchor="middle">仿真已验证</text><path d="M540 672L540 694" fill="none" stroke="#087C72" stroke-width="2"/><rect x="392" y="694" width="296" height="156" rx="22" fill="#FFFFFF" stroke="#D7E5DF"/><text x="540" y="756" font-size="34" fill="#173C3B" font-weight="650" text-anchor="middle">ROS 2</text><text x="540" y="806" font-size="28" fill="#087C72" font-weight="500" text-anchor="middle">导航接入路径</text><path d="M860 672L860 694" fill="none" stroke="#087C72" stroke-width="2"/><rect x="712" y="694" width="296" height="156" rx="22" fill="#FFFFFF" stroke="#D7E5DF"/><text x="860" y="756" font-size="34" fill="#173C3B" font-weight="650" text-anchor="middle">真实机器人</text><text x="860" y="806" font-size="28" fill="#087C72" font-weight="500" text-anchor="middle">现场待验收</text><text x="540" y="901" font-size="29" fill="#647B77" font-weight="400" text-anchor="middle">单机器人先落地 · 保留多机器人扩展接口</text><rect x="72" y="943" width="936" height="266" rx="28" fill="#173C3B" stroke="none"/><rect x="106" y="977" width="104" height="37" rx="9" fill="#EDC477" stroke="none"/><text x="158" y="1004" font-size="24" fill="#173C3B" font-weight="650" text-anchor="middle">求职中</text><text x="106" y="1081" font-size="46" fill="#FFFFFF" font-weight="600" >希望加入做机器人落地的团队</text><text x="106" y="1135" font-size="29" fill="#D3E8DE" font-weight="400" >机器人 Agent · 具身智能系统 · 机器人软件</text><text x="106" y="1178" font-size="28" fill="#D3E8DE" font-weight="400" >欢迎交流项目、技术问题与工作机会。</text><text x="72" y="1261" font-size="26" fill="#647B77" font-weight="500" >代码与文档 / GitHub</text><text x="72" y="1305" font-size="29" fill="#087C72" font-weight="550" >github.com/SUSTechWLA/tangying-robot-agent-os</text><path d="M72 1354L1008 1354" fill="none" stroke="#D7E5DF" stroke-width="2"/><text x="72" y="1396" font-size="22" fill="#647B77" font-weight="400" >开源项目 · 仿真验证 · 实机待接入</text><text x="1008" y="1396" font-size="20" fill="#087C72" font-weight="600" text-anchor="end" letter-spacing="2">TANGYING</text></svg>