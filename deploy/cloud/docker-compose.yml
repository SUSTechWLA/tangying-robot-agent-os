services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fleet}
      MYSQL_USER: ${MYSQL_USER:-fleet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - fleet-mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - fleet-redis:/data

  fleet-control-plane:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLEET_LISTEN: :8080
      FLEET_STORE: mysql
      MYSQL_DSN: ${MYSQL_USER:-fleet}:${MYSQL_PASSWORD:-change-me}@tcp(mysql:3306)/${MYSQL_DATABASE:-fleet}?parseTime=true&charset=utf8mb4
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_STREAM: fleet.tasks.ready
      REDIS_GROUP: fleet-control-plane
      AGENT_PROVIDER: ${AGENT_PROVIDER:-deterministic}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_ORCHESTRATION_SAMPLES: ${AGENT_ORCHESTRATION_SAMPLES:-1}
    ports:
      - "${FLEET_PORT:-8080}:8080"

volumes:
  fleet-mysql:
  fleet-redis:
