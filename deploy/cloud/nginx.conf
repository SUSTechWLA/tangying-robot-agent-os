# Tangying Fleet nginx configuration.
#
# Security model:
#   - port 8080 (fleet-control-plane HTTP) is NEVER published to the host;
#     only nginx reaches it on the internal compose network.
#   - port 443 terminates TLS for the console and the device HTTP data
#     plane. Console authentication is the operator bearer token; device
#     data-plane authentication uses robot-specific id/token headers.
#   - port 8444 is a TCP passthrough to the fleet gRPC gateway (8443), where
#     mTLS is enforced end-to-end with the fleet CA.
#   - client IP whitelisting is applied via /etc/nginx/allowed.conf
#     (generated from FLEET_ALLOWED_CIDRS by scripts/fleet-up.sh).
#
# For production behind an ALB/SLB: terminate TLS at the load balancer with
# your domain certificate, restrict the security group to the LB, and keep
# this nginx as the inner gate (or replace it with an ingress).

events {}

stream {
    # Robot public access: mTLS gRPC passthrough (TLS terminates in the app).
    server {
        listen 8444;
        proxy_pass fleet-control-plane:8443;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream fleet_control_plane {
        server fleet-control-plane:8080;
        keepalive 16;
    }

    # Local browser/simulator development entry. Docker binds this listener
    # exclusively to host loopback; production traffic still uses HTTPS 443.
    server {
        listen 80;
        server_name _;

        include /etc/nginx/allowed.conf;

		location = /v1/world/events/ws {
			proxy_pass http://fleet_control_plane;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_buffering off;
			proxy_read_timeout 1h;
		}

        location / {
            proxy_pass http://fleet_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fleet-server.crt;
        ssl_certificate_key /etc/nginx/certs/fleet-server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        include /etc/nginx/allowed.conf;

        client_max_body_size 4m;

		location = /v1/world/events/ws {
			proxy_pass http://fleet_control_plane;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_buffering off;
			proxy_read_timeout 1h;
		}

        location / {
            proxy_pass http://fleet_control_plane;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
            # Long-poll support for /v1/queue/next.
            proxy_buffering off;
        }
    }
}
