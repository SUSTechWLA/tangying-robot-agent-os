services:
  gazebo-house:
    image: tangying-navigation:dev
    build:
      context: ../../..
      dockerfile: deploy/robot/navigation/Dockerfile
      args:
        ROS_IMAGE: ${ROS_IMAGE:-ros:jazzy-ros-base}
    init: true
    ports:
      - "127.0.0.1:${TANGYING_NAVIGATION_PORT:-18791}:18790"
      # The robot.profile.v1 runtime. Published because the agent dials it from
      # outside the container, exactly as it dials a physical robot; an unpublished
      # port would leave exec-ing into the container as the only way to drive this.
      - "127.0.0.1:${TANGYING_GAZEBO_RUNTIME_PORT:-18792}:50071"
    environment:
      TANGYING_NAVIGATION_TOKEN: ${TANGYING_NAVIGATION_TOKEN:?Set a private navigation token}
      TANGYING_NAVIGATION_PORT: "18790"
      TANGYING_RUNTIME_PORT: "50071"
      TANGYING_GVF_ENABLED: ${TANGYING_GVF_ENABLED:-0}
      TANGYING_GVF_ROOT: /data/maps/grounded-runtime
      # Surveys land on a named volume, so rebuilding the image does not quietly
      # orphan the map a previous run produced.
      TANGYING_MAP_ROOT: /data/maps/gazebo_house/workflow
      # Off by default. Per-step traces of the bounded driver, because "the robot
      # did not move" has four different causes and no other signal separates them.
      TANGYING_TRACE_STEPS: ${TANGYING_TRACE_STEPS:-}
      TANGYING_NAVIGATION_MODE: ${TANGYING_NAVIGATION_MODE:-mapping}
      TANGYING_NAVIGATION_SCENE: gazebo_house
      TANGYING_NAVIGATION_INPUT_MODE: ros
      TANGYING_NAVIGATION_HTTP_HOST: 0.0.0.0
      TANGYING_RUNTIME_ROBOT_ID: gazebo-house-rgbd
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-62}
      ROS_LOCALHOST_ONLY: "1"
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      TANGYING_GAZEBO_WORLD: ${TANGYING_GAZEBO_WORLD:-}
      GZ_SIM_RESOURCE_PATH: /assets/harmonic-models
      SDF_PATH: /assets/harmonic-models
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - ../../../artifacts/sim-assets:/assets:ro
      - tangying-gazebo-house-maps:/data/maps
    stop_signal: SIGINT
    stop_grace_period: 60s

volumes:
  tangying-gazebo-house-maps:
