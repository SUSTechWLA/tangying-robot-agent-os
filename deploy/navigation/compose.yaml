services:
  navigation:
    image: tangying-navigation:dev
    build:
      context: ../..
      dockerfile: deploy/navigation/Dockerfile
      args:
        ROS_IMAGE: ${ROS_IMAGE:-ros:jazzy-ros-base}
    init: true
    ports:
      - "127.0.0.1:${TANGYING_NAVIGATION_PORT:-18790}:18790"
    environment:
      TANGYING_NAVIGATION_TOKEN: ${TANGYING_NAVIGATION_TOKEN:?Set a private navigation token}
      TANGYING_NAVIGATION_INPUT_MODE: ${TANGYING_NAVIGATION_INPUT_MODE:-runtime}
      TANGYING_NAVIGATION_MODE: ${TANGYING_NAVIGATION_MODE:-mapping}
      TANGYING_NAVIGATION_DATABASE: /data/maps/rtabmap.db
      TANGYING_RUNTIME_ADDRESS: ${TANGYING_RUNTIME_ADDRESS:-host.docker.internal:50051}
      TANGYING_RUNTIME_ROBOT_ID: ${TANGYING_RUNTIME_ROBOT_ID:-xlerobot-mujoco-tabletop}
      TANGYING_RUNTIME_HEAD_SOURCE: ${TANGYING_RUNTIME_HEAD_SOURCE:-xlerobot-mujoco-tabletop/head-rgbd}
      TANGYING_RUNTIME_BASE_SOURCE: ${TANGYING_RUNTIME_BASE_SOURCE:-xlerobot-mujoco-tabletop/base-rgbd}
      TANGYING_RUNTIME_INSECURE: ${TANGYING_RUNTIME_INSECURE:-1}
      TANGYING_NAVIGATION_HTTP_HOST: 0.0.0.0
      TANGYING_NAVIGATION_TRACE_VELOCITY: ${TANGYING_NAVIGATION_TRACE_VELOCITY:-0}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-61}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      ROS_LOCALHOST_ONLY: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - tangying-navigation-maps:/data/maps
    stop_signal: SIGINT
    stop_grace_period: 60s
volumes:
  tangying-navigation-maps:
