name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: make setup
      - run: make test
      - run: make lint
      - run: .venv/bin/python scripts/run_simulation_acceptance.py --episodes 30 --seed 20260817

  ros-build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && rosdep update && rosdep install --from-paths robot/ros2_ws/src --ignore-src --skip-keys ament_python -r -y
      - run: cd robot/ros2_ws && . /opt/ros/jazzy/setup.sh && colcon build --event-handlers console_direct+
