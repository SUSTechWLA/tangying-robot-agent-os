name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    # The full suite runs the Go, Python and Web tests plus the e2e stacks,
    # which take roughly 2.5x longer here than on a developer machine
    # (software rendering, two cores). 20 minutes killed the job before it
    # could report anything.
    timeout-minutes: 45
    env:
      MUJOCO_GL: 'osmesa'
      PYTHONUNBUFFERED: '1'
      PYTEST_ADDOPTS: '-vv'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libosmesa6
      - run: make setup
      - run: .venv/bin/pip install -e '.[visual]'
      - run: echo "RUNTIME_CLIENT_PROBE=$RUNNER_TEMP/runtime-client-probe" >> "$GITHUB_ENV"
      - run: go build -o "$RUNTIME_CLIENT_PROBE" ./tests/contract/runtime_client_probe
      - run: PYTHONUNBUFFERED=1 timeout 5m .venv/bin/pytest --collect-only -q
      - run: make test
      - run: make lint
      - run: make build
      - run: bash scripts/demo.sh
      - run: .venv/bin/python scripts/run_simulation_acceptance.py --episodes 30 --seed 20260817

  installer-dry-run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            role: sim
            test_os: linux
            distro: ubuntu
            version: '24.04'
            arch: amd64
          - runner: ubuntu-24.04
            role: local
            test_os: linux
            distro: ubuntu
            version: '22.04'
            arch: amd64
          - runner: ubuntu-24.04
            role: robot-pi
            test_os: linux
            distro: ubuntu
            version: '24.04'
            arch: arm64
          - runner: macos-14
            role: sim
            test_os: darwin
            distro: macos
            version: '14'
            arch: arm64
          - runner: macos-14
            role: local
            test_os: darwin
            distro: macos
            version: '14'
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate ${{ matrix.role }} install plan
        env:
          ROBOT_AGENT_TEST_MODE: '1'
          ROBOT_AGENT_TEST_OS: ${{ matrix.test_os }}
          ROBOT_AGENT_TEST_DISTRO: ${{ matrix.distro }}
          ROBOT_AGENT_TEST_VERSION: ${{ matrix.version }}
          ROBOT_AGENT_TEST_ARCH: ${{ matrix.arch }}
        run: bash install.sh "${{ matrix.role }}" --dry-run --yes

  robot-pi-dependencies:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the actual Robot Edge dependencies on Linux ARM64
        run: |
          python -m venv "$RUNNER_TEMP/robot-pi-venv"
          "$RUNNER_TEMP/robot-pi-venv/bin/python" -m pip install --dry-run --ignore-installed \
            --report "$RUNNER_TEMP/robot-pi-dependencies.json" -e '.[robot-pi]'
      - uses: actions/upload-artifact@v4
        with:
          name: robot-pi-dependency-resolution
          path: ${{ runner.temp }}/robot-pi-dependencies.json

  ros-build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3-venv && rosdep update && rosdep install --from-paths robot/ros2_ws/src --ignore-src --skip-keys ament_python -r -y
      - name: Install shared protocol dependencies for ROS tests
        run: |
          python3 -m venv --system-site-packages "$RUNNER_TEMP/ros-protocol-venv"
          "$RUNNER_TEMP/ros-protocol-venv/bin/python" - <<'PY'
          import os
          import subprocess
          import sys
          import sysconfig
          import tomllib
          from pathlib import Path

          dependencies = tomllib.loads(Path("pyproject.toml").read_text())["project"]["dependencies"]
          pins = [next(dep for dep in dependencies if dep.startswith(name + "=="))
                  for name in ("grpcio", "protobuf")]
          subprocess.run([sys.executable, "-m", "pip", "install", *pins], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"ROS_PROTOCOL_SITE_PACKAGES={sysconfig.get_path('purelib')}\n")
          PY
      - run: cd robot/ros2_ws && . /opt/ros/jazzy/setup.sh && colcon build --event-handlers console_direct+
      - name: Test continuous goal scoring and installed DWB plugin loading
        working-directory: robot/ros2_ws
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          export PYTHONPATH="$ROS_PROTOCOL_SITE_PACKAGES:$GITHUB_WORKSPACE/python${PYTHONPATH:+:$PYTHONPATH}"
          python3 -c 'import rclpy; from tangying_robot_proto.robot.v1 import robot_pb2, robot_pb2_grpc; print("ROS and shared protocol imports OK")'
          colcon test --packages-select tangying_navigation tangying_dwb_critics --return-code-on-test-failure --event-handlers console_direct+
      - name: Report ROS test results
        if: ${{ always() }}
        working-directory: robot/ros2_ws
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon test-result --verbose

  mujoco-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MUJOCO_GL: 'osmesa'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libosmesa6
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev,visual]'
      - name: Exercise the next MuJoCo without changing the release baseline
        run: |
          .venv/bin/pip install --no-deps --target "$RUNNER_TEMP/mujoco-compat" mujoco==3.12.0
          PYTHONPATH="$RUNNER_TEMP/mujoco-compat" .venv/bin/python -m pytest -q \
            sim/mujoco/tests/test_self_filter.py \
            sim/mujoco/tests/test_rgbd_workcell.py
