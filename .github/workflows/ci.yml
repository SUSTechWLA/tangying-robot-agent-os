name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTEST_ADDOPTS: '-vv'
      RUNTIME_CLIENT_PROBE: ${{ runner.temp }}/runtime-client-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: make setup
      - run: .venv/bin/pip install -e '.[visual]'
      - run: go build -o "$RUNTIME_CLIENT_PROBE" ./tests/contract/runtime_client_probe
      - run: PYTHONUNBUFFERED=1 timeout 5m .venv/bin/pytest --collect-only -q
      - run: timeout 3m .venv/bin/pytest -s -vv tests/contract/test_sim_real_runtime_boundary.py
      - run: make test
      - run: make lint
      - run: make build
      - run: bash scripts/demo.sh
      - run: .venv/bin/python scripts/run_simulation_acceptance.py --episodes 30 --seed 20260817

  installer-dry-run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            role: sim
            test_os: linux
            distro: ubuntu
            version: '24.04'
            arch: amd64
          - runner: ubuntu-24.04
            role: local
            test_os: linux
            distro: ubuntu
            version: '22.04'
            arch: amd64
          - runner: ubuntu-24.04
            role: robot-pi
            test_os: linux
            distro: ubuntu
            version: '24.04'
            arch: arm64
          - runner: macos-14
            role: sim
            test_os: darwin
            distro: macos
            version: '14'
            arch: arm64
          - runner: macos-14
            role: local
            test_os: darwin
            distro: macos
            version: '14'
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate ${{ matrix.role }} install plan
        env:
          ROBOT_AGENT_TEST_MODE: '1'
          ROBOT_AGENT_TEST_OS: ${{ matrix.test_os }}
          ROBOT_AGENT_TEST_DISTRO: ${{ matrix.distro }}
          ROBOT_AGENT_TEST_VERSION: ${{ matrix.version }}
          ROBOT_AGENT_TEST_ARCH: ${{ matrix.arch }}
        run: bash install.sh "${{ matrix.role }}" --dry-run --yes

  ros-build:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && rosdep update && rosdep install --from-paths robot/ros2_ws/src --ignore-src --skip-keys ament_python -r -y
      - run: cd robot/ros2_ws && . /opt/ros/jazzy/setup.sh && colcon build --event-handlers console_direct+
