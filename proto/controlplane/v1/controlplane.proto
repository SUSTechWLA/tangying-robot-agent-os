syntax = "proto3";

package tangying.controlplane.v1;

option go_package = "github.com/SUSTechWLA/tangying-robot-agent-os/gen/go/controlplane/v1;controlplanev1";

import "google/protobuf/struct.proto";

service ControlPlane {
  rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc AppendTaskEvent(AppendTaskEventRequest) returns (AppendTaskEventResponse);
}

message RegisterAgentRequest {
  string device_id = 1;
  string agent_version = 2;
  repeated string capabilities = 3;
}

message RegisterAgentResponse {
  string agent_id = 1;
  string session_id = 2;
  uint32 heartbeat_interval_seconds = 3;
}

message ClaimTaskRequest {
  string agent_id = 1;
  string session_id = 2;
}

message TaskPlanEnvelope {
  string task_id = 1;
  string schema_version = 2;
  bytes plan_json = 3;
  uint64 revision = 4;
}

message ClaimTaskResponse {
  TaskPlanEnvelope task = 1;
  string lease_id = 2;
  int64 lease_expires_unix_ms = 3;
}

message RenewLeaseRequest {
  string lease_id = 1;
  string agent_id = 2;
}

message RenewLeaseResponse {
  int64 lease_expires_unix_ms = 1;
}

message TaskEvent {
  string task_id = 1;
  uint64 sequence = 2;
  string event_type = 3;
  string step_id = 4;
  int64 occurred_unix_ms = 5;
  google.protobuf.Struct payload = 6;
}

message AppendTaskEventRequest {
  TaskEvent event = 1;
  string idempotency_key = 2;
}

message AppendTaskEventResponse {
  bool stored = 1;
  uint64 next_sequence = 2;
}
