[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tangying-robot-agent-os"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = [
  # Keep generated stubs and the ROS bridge on the same release toolchain.
  "grpcio==1.83.0",
  # LeRobot 0.4.1 / wandb requires Protobuf <7; generated wire schema is unchanged.
  "grpcio-tools==1.81.0",
  "protobuf==6.33.5",
  # v0.2 simulation acceptance baseline; newer engines need explicit validation.
  "mujoco==3.11.0",
  "numpy==2.4.6",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
robot-pi = [
  "lerobot[feetech]==0.4.1",
  # 4.12 requires NumPy <2.3; 4.11 supports the shared simulation/robot baseline.
  "opencv-python-headless==4.11.0.86",
]
mcp = [
  "mcp>=1.28,<2",
  "httpx>=0.28,<1",
]
dev = [
  "PyYAML==6.0.3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
]
visual = [
  "trimesh==4.12.2",
  "pygltflib==1.16.5",
  "Pillow==12.3.0",
  "scipy==1.17.1",
]

[project.scripts]
tangying-mcp = "tangying_mcp.server:main"
tangying-robot-adapter = "tangying_robot_gateway.run_plugin:main"
tangying-train-semantic-policy = "tangying_sim.training.cli:main"

[tool.setuptools.packages.find]
where = ["python", "sim/mujoco", "sim/robocasa", "robot/gateway", "robot/mcp", "policy/sidecar"]
include = ["tangying_robot_proto*", "tangying_sim*", "tangying_robocasa*", "tangying_robot_gateway*", "tangying_mcp*", "tangying_policy_sidecar*"]

# Semantic location layouts are data the gateway reads at runtime, so they must
# ship inside the wheel rather than only existing in a source checkout.
[tool.setuptools.package-data]
tangying_robot_gateway = ["assets/*.json"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--durations=20"]
timeout = 180
timeout_method = "thread"
pythonpath = ["python", "sim/mujoco", "sim/robocasa", "robot/gateway", "robot/mcp", "robot/ros2_ws/src/xlerobot_adapter", "policy/sidecar", "."]
testpaths = ["tests", "sim/mujoco/tests", "sim/robocasa/tests", "robot/gateway/tests", "robot/ros2_ws/src/xlerobot_adapter/test", "robot/ros2_ws/src/tangying_navigation/test", "policy/sidecar/tests"]
markers = [
  "robocasa: requires the isolated RoboCasa environment and downloaded kitchen assets",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["python/tangying_robot_proto"]

[tool.ruff.lint.per-file-ignores]
"scripts/robocasa-smoke.py" = ["N999"]
