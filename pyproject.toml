[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tangying-robot-agent-os"
version = "0.2.0rc2"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.75,<2",
  "grpcio-tools>=1.75,<2",
  "mujoco>=3.3,<4",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.12,<1",
]
visual = [
  "trimesh==4.12.2",
  "pygltflib==1.16.5",
  "Pillow==12.3.0",
  "scipy==1.17.1",
]

[project.scripts]
tangying-train-semantic-policy = "tangying_sim.training.cli:main"

[tool.setuptools.packages.find]
where = ["python", "sim/mujoco", "sim/robocasa", "robot/gateway", "policy/sidecar"]
include = ["tangying_robot_proto*", "tangying_sim*", "tangying_robocasa*", "tangying_robot_gateway*", "tangying_policy_sidecar*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--durations=20"]
timeout = 180
timeout_method = "thread"
pythonpath = ["python", "sim/mujoco", "sim/robocasa", "robot/gateway", "robot/ros2_ws/src/xlerobot_adapter", "policy/sidecar", "."]
testpaths = ["tests", "sim/mujoco/tests", "sim/robocasa/tests", "robot/gateway/tests", "policy/sidecar/tests"]
markers = [
  "robocasa: requires the isolated RoboCasa environment and downloaded kitchen assets",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["python/tangying_robot_proto"]

[tool.ruff.lint.per-file-ignores]
"scripts/robocasa-smoke.py" = ["N999"]
