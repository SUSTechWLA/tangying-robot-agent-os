bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.01
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.0001
    min_y_velocity_threshold: 0.0001
    min_theta_velocity_threshold: 0.0001
    failure_tolerance: 0.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.01
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.01
      yaw_goal_tolerance: 0.03
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.05
      max_vel_x: 0.05
      min_vel_y: -0.05
      max_vel_y: 0.05
      max_vel_theta: 0.2
      min_speed_xy: 0.0
      max_speed_xy: 0.05
      min_speed_theta: 0.0
      acc_lim_x: 0.1
      acc_lim_y: 0.1
      acc_lim_theta: 0.4
      decel_lim_x: -0.1
      decel_lim_y: -0.1
      decel_lim_theta: -0.4
      vx_samples: 9
      vy_samples: 9
      vtheta_samples: 9
      sim_time: 1.5
      linear_granularity: 0.01
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.01
      trans_stopped_velocity: 0.002
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      ObstacleFootprint.scale: 0.1
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.05
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.05
      PathDist.scale: 16.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 16.0
      RotateToGoal.slowing_factor: 2.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.025
      footprint: '[[-0.24,-0.23],[0.22,-0.23],[0.22,0.21],[-0.24,0.21]]'
      track_unknown_space: true
      transform_tolerance: 0.2
      plugins:
      - obstacles
      - inflation
      obstacles:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        origin_z: 0.0
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: base_mark base_clear head_mark head_clear
        base_mark:
          topic: /camera/base/points
          data_type: PointCloud2
          clearing: false
          marking: true
          min_obstacle_height: 0.04
          max_obstacle_height: 2.0
          obstacle_min_range: 0.08
          obstacle_max_range: 3.0
          raytrace_min_range: 0.08
          raytrace_max_range: 5.0
          expected_update_rate: 0.5
        base_clear:
          topic: /camera/base/points
          data_type: PointCloud2
          clearing: true
          marking: false
          min_obstacle_height: -0.1
          max_obstacle_height: 2.0
          obstacle_min_range: 0.08
          obstacle_max_range: 3.0
          raytrace_min_range: 0.08
          raytrace_max_range: 5.0
          expected_update_rate: 0.5
        head_mark:
          topic: /camera/head/points
          data_type: PointCloud2
          clearing: false
          marking: true
          min_obstacle_height: 0.04
          max_obstacle_height: 2.0
          obstacle_min_range: 0.08
          obstacle_max_range: 3.0
          raytrace_min_range: 0.08
          raytrace_max_range: 5.0
          expected_update_rate: 0.5
        head_clear:
          topic: /camera/head/points
          data_type: PointCloud2
          clearing: true
          marking: false
          min_obstacle_height: -0.1
          max_obstacle_height: 2.0
          obstacle_min_range: 0.08
          obstacle_max_range: 3.0
          raytrace_min_range: 0.08
          raytrace_max_range: 5.0
          expected_update_rate: 0.5
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.025
      footprint: '[[-0.24,-0.23],[0.22,-0.23],[0.22,0.21],[-0.24,0.21]]'
      track_unknown_space: true
      transform_tolerance: 0.2
      plugins:
      - static_layer
      - inflation
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        # The robot currently occupies this measured full footprint. Its own
        # occlusion must not make the planning origin unknown. This modifies
        # only the costmap layer, never RTAB-Map or future unobserved space.
        footprint_clearing_enabled: true
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
      always_send_full_costmap: true
