<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" role="img" aria-labelledby="title description">
<title id="title">图 8-2　聚合提交与外部效果的边界</title><desc id="description">CAS 保护同一聚合的状态转换；设备效果在 SQL 事务之外。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#006f78"/></marker></defs>
<rect width="960" height="730" rx="16" fill="#f4f7f7"/>
<text x="30" y="42" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#173544">图 8-2　聚合提交与外部效果的边界</text>
<rect x="30" y="85" width="260" height="105" rx="10" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="46" y="114" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">处理者 A</text>
<text x="46" y="143" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">读取 v=17</text>
<text x="46" y="167" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">提交 expected=17</text>
<rect x="670" y="85" width="260" height="105" rx="10" fill="#fff0d5" stroke="#9db8bf"/>
<text x="686" y="114" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">处理者 B</text>
<text x="686" y="143" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">也读取 v=17</text>
<text x="686" y="167" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">稍后提交 expected=17</text>
<rect x="350" y="265" width="260" height="105" rx="10" fill="#e8edf7" stroke="#9db8bf"/>
<text x="366" y="294" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">唯一当前版本</text>
<text x="366" y="323" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">A 先成功：v=18</text>
<text x="366" y="347" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">B 失败后必须重新读取</text>
<line x1="160" y1="190" x2="430" y2="265" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="295.0" y="224" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">先提交</text>
<line x1="800" y1="190" x2="530" y2="265" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="665.0" y="224" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">旧版本冲突</text>
<rect x="30" y="425" width="550" height="175" rx="10" fill="#e4f1ef" stroke="#006f78" stroke-width="2"/>
<text x="50" y="457" font-family="sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#173544">一次 eventstore SQL 事务</text>
<text x="50" y="493" font-family="sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#173544">聚合状态 + 事件</text>
<text x="50" y="524" font-family="sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#173544">Outbox + 检查点</text>
<text x="50" y="555" font-family="sans-serif" font-size="18" font-weight="normal" text-anchor="start" fill="#173544">全部提交，或全部回滚</text>
<line x1="480" y1="370" x2="305" y2="425" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="392.5" y="407" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">同一存储边界</text>
<rect x="670" y="457" width="260" height="105" rx="10" fill="#fff0d5" stroke="#9db8bf"/>
<text x="686" y="486" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">设备 / 物理世界</text>
<text x="686" y="515" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">动作可能已发生</text>
<text x="686" y="539" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">事务回滚不能撤销</text>
<line x1="580" y1="510" x2="670" y2="510" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="625.0" y="496" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">调用</text>
<text x="30" y="654" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#173544">先记 pending → 调用设备 → 核对证据 → 再记结果。</text>
<text x="30" y="696" font-family="sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#173544">Outbox 可重投消息；未知物理效果不能因此自动重做。</text>
</svg>
