<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 598" role="img" aria-labelledby="title description">
<title id="title">图 3-1　命令返回与物理完成是两件事</title><desc id="description">只有最后一步满足任务判据，才有足够依据记录物理完成。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#006f78"/></marker></defs>
<rect width="960" height="598" rx="16" fill="#f4f7f7"/>
<text x="30" y="42" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#173544">图 3-1　命令返回与物理完成是两件事</text>
<rect x="18" y="75" width="204" height="44" rx="8" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="120" y="104" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#173544">Agent</text>
<line x1="120" y1="119" x2="120" y2="538" stroke="#a8bdc2" stroke-dasharray="5 5"/>
<rect x="258" y="75" width="204" height="44" rx="8" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="360" y="104" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#173544">Runtime</text>
<line x1="360" y1="119" x2="360" y2="538" stroke="#a8bdc2" stroke-dasharray="5 5"/>
<rect x="498" y="75" width="204" height="44" rx="8" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="600" y="104" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#173544">控制器</text>
<line x1="600" y1="119" x2="600" y2="538" stroke="#a8bdc2" stroke-dasharray="5 5"/>
<rect x="738" y="75" width="204" height="44" rx="8" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="840" y="104" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#173544">观测 / 验证</text>
<line x1="840" y1="119" x2="840" y2="538" stroke="#a8bdc2" stroke-dasharray="5 5"/>
<line x1="120" y1="160" x2="360" y2="160" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="240.0" y="148" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">1. Execute：commandId 与目标</text>
<line x1="360" y1="228" x2="600" y2="228" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="480.0" y="216" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">2. 派发运动</text>
<line x1="600" y1="296" x2="360" y2="296" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="480.0" y="284" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">3. 控制器返回结果</text>
<line x1="360" y1="364" x2="120" y2="364" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="240.0" y="352" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">4. 工具结果：成功或不确定</text>
<line x1="120" y1="432" x2="840" y2="432" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="480.0" y="420" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">5. 请求命令后的新观测</text>
<line x1="840" y1="500" x2="120" y2="500" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="480.0" y="488" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">6. 身份、时效、后置条件通过</text>
<text x="30" y="576" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">只有最后一步满足任务判据，才有足够依据记录物理完成。</text>
</svg>
