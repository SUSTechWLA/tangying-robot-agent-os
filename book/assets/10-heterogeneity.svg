<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title description">
<title id="title">图 10-1　统一合同，三种不同的运动可行域</title><desc id="description">三个分支是本体选择，不是依次执行。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#006f78"/></marker></defs>
<rect width="960" height="650" rx="16" fill="#f4f7f7"/>
<text x="30" y="42" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#173544">图 10-1　统一合同，三种不同的运动可行域</text>
<rect x="350" y="80" width="260" height="105" rx="10" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="366" y="109" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">共同任务与空间依据</text>
<text x="366" y="138" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">区域 / map / transform</text>
<text x="366" y="162" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">目标、观测与完成判据</text>
<rect x="30" y="300" width="260" height="105" rx="10" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="46" y="329" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">AGV</text>
<text x="46" y="358" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">二维 / 地形可通行区域</text>
<text x="46" y="382" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">转弯半径、坡度与制动</text>
<rect x="350" y="300" width="260" height="105" rx="10" fill="#e8edf7" stroke="#9db8bf"/>
<text x="366" y="329" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">足式</text>
<text x="366" y="358" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">支撑面、步态与稳定性</text>
<text x="366" y="382" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">可跨越不等于当前可执行</text>
<rect x="670" y="300" width="260" height="105" rx="10" fill="#fff0d5" stroke="#9db8bf"/>
<text x="686" y="329" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">UAV</text>
<text x="686" y="358" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">三维净空与飞行包线</text>
<text x="686" y="382" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">飞控状态、悬停与降落</text>
<line x1="430" y1="185" x2="160" y2="300" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="295.0" y="245" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">Profile</text>
<line x1="480" y1="185" x2="480" y2="300" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="480.0" y="245" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">Profile</text>
<line x1="530" y1="185" x2="800" y2="300" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="665.0" y="245" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">Profile</text>
<rect x="350" y="510" width="260" height="105" rx="10" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="366" y="539" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">共同结果外壳</text>
<text x="366" y="568" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">command / capture / frame</text>
<text x="366" y="592" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">后置条件仍按本体具体化</text>
<line x1="160" y1="405" x2="430" y2="510" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="295.0" y="460" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">观测</text>
<line x1="480" y1="405" x2="480" y2="510" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="480.0" y="475" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">观测</text>
<line x1="800" y1="405" x2="530" y2="510" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="665.0" y="460" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">观测</text>
<text x="30" y="637" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">复用生命周期与身份契约；控制器、可行域与停止判据保留设备差异。</text>
</svg>
