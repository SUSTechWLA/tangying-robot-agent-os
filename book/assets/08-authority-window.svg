<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" role="img" aria-labelledby="title description">
<title id="title">图 8-3　慢查询之后，再查一次当前执行权</title><desc id="description">目录读取期间可能发生取消；最后重查缩短竞争窗口，但不能跨进程原子提交。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#006f78"/></marker></defs>
<rect width="960" height="790" rx="16" fill="#f4f7f7"/>
<text x="30" y="42" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#173544">图 8-3　慢查询之后，再查一次当前执行权</text>
<rect x="30" y="95" width="260" height="105" rx="10" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="46" y="124" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">初次权限检查</text>
<text x="46" y="153" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">原任务 / revision / claim</text>
<text x="46" y="177" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">此时有效，不保证稍后仍有效</text>
<rect x="350" y="95" width="260" height="105" rx="10" fill="#e8edf7" stroke="#9db8bf"/>
<text x="366" y="124" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">慢 Catalogue RPC</text>
<text x="366" y="153" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">读取当前能力与合同</text>
<text x="366" y="177" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">等待期间不能冻结外部状态</text>
<rect x="670" y="95" width="260" height="105" rx="10" fill="#fff0d5" stroke="#9db8bf"/>
<text x="686" y="124" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">异步权限变化</text>
<text x="686" y="153" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">操作员取消 / claim 变更</text>
<text x="686" y="177" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">可在目录返回之前发生</text>
<line x1="290" y1="147" x2="350" y2="147" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="320.0" y="133" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">通过</text>
<rect x="350" y="310" width="260" height="105" rx="10" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="366" y="339" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">派发前最后重查</text>
<text x="366" y="368" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">重新核对当前 authority</text>
<text x="366" y="392" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">不复用初检的“已允许”</text>
<line x1="480" y1="200" x2="480" y2="310" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="480.0" y="257" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">目录返回后</text>
<path d="M800,200 L800,362 L610,362" fill="none" stroke="#006f78" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="815" y="285" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">权限已变</text>
<rect x="30" y="550" width="390" height="105" rx="10" fill="#fff0d5" stroke="#9db8bf"/>
<text x="46" y="579" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">拒绝本次 dispatch</text>
<text x="46" y="608" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">记录取消 / 过期 / 版本冲突</text>
<text x="46" y="632" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">候选仍在，也不调用设备</text>
<rect x="540" y="550" width="390" height="105" rx="10" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="556" y="579" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">进入设备执行边界</text>
<text x="556" y="608" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">Runtime 核对身份 / 租约 / journal</text>
<text x="556" y="632" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">设备反馈与物理后置条件另验</text>
<line x1="430" y1="415" x2="225" y2="550" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="327.5" y="477" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">不通过</text>
<line x1="530" y1="415" x2="735" y2="550" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="632.5" y="439" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">通过</text>
<rect x="540" y="466" width="390" height="51" rx="8" fill="#fff0d5" stroke="#9db8bf" stroke-dasharray="5 4"/>
<text x="735" y="498" font-family="sans-serif" font-size="17" font-weight="normal" text-anchor="middle" fill="#173544">重查 → 派发仍有跨进程时间窗</text>
<text x="30" y="704" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#173544">修复的是“慢查询后仍沿用旧许可”；不能把最后重查说成分布式原子事务。</text>
<text x="30" y="747" font-family="sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#173544">接收端仍需执行自己的准入、租约与停止规则；物理效果仍在数据库事务外。</text>
</svg>
