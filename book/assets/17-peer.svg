<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 598" role="img" aria-labelledby="title description">
<title id="title">图 17-2　数据已送达，离业务采纳还有两层</title><desc id="description">ACK ≠ 采用覆盖建议 ≠ 目标物理完成。不同地图依据先拒绝合并。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#006f78"/></marker></defs>
<rect width="960" height="598" rx="16" fill="#f4f7f7"/>
<text x="30" y="42" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#173544">图 17-2　数据已送达，离业务采纳还有两层</text>
<rect x="18" y="75" width="204" height="44" rx="8" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="120" y="104" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#173544">发送 Agent</text>
<line x1="120" y1="119" x2="120" y2="538" stroke="#a8bdc2" stroke-dasharray="5 5"/>
<rect x="258" y="75" width="204" height="44" rx="8" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="360" y="104" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#173544">发送 Outbox</text>
<line x1="360" y1="119" x2="360" y2="538" stroke="#a8bdc2" stroke-dasharray="5 5"/>
<rect x="498" y="75" width="204" height="44" rx="8" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="600" y="104" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#173544">接收 Inbox</text>
<line x1="600" y1="119" x2="600" y2="538" stroke="#a8bdc2" stroke-dasharray="5 5"/>
<rect x="738" y="75" width="204" height="44" rx="8" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="840" y="104" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#173544">接收端消费者</text>
<line x1="840" y1="119" x2="840" y2="538" stroke="#a8bdc2" stroke-dasharray="5 5"/>
<line x1="120" y1="160" x2="360" y2="160" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="240.0" y="148" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">1. 持久提交 observation 信封</text>
<line x1="360" y1="228" x2="600" y2="228" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="480.0" y="216" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">2. 身份、sequence、TTL、Basis</text>
<line x1="600" y1="296" x2="360" y2="296" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="480.0" y="284" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">3. ACK：已接受这封消息</text>
<line x1="840" y1="364" x2="600" y2="364" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="720.0" y="352" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">4. 按持久 feed 游标读取</text>
<line x1="600" y1="432" x2="840" y2="432" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="720.0" y="420" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">5. 原 payload 与来源</text>
<path d="M840,500 h60 v24 h-60" fill="none" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="840" y="488" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#173544">6. 生成本地建议；不授予动作</text>
<text x="30" y="576" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">ACK ≠ 采用覆盖建议 ≠ 目标物理完成。不同地图依据先拒绝合并。</text>
