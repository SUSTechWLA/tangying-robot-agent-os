<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" role="img" aria-labelledby="title description">
<title id="title">图 4-1　传感器数据怎样变成规划依据</title><desc id="description">语义回答“是什么”，几何与控制约束共同回答“能否去”。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#006f78"/></marker></defs>
<rect width="960" height="495" rx="16" fill="#f4f7f7"/>
<text x="30" y="42" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="start" fill="#173544">图 4-1　传感器数据怎样变成规划依据</text>
<rect x="30" y="90" width="260" height="105" rx="10" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="46" y="119" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">原始采集</text>
<text x="46" y="148" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">点云 / RGB-D / 位姿</text>
<text x="46" y="172" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">时间戳和来源</text>
<rect x="350" y="90" width="260" height="105" rx="10" fill="#e8edf7" stroke="#9db8bf"/>
<text x="366" y="119" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">几何登记</text>
<text x="366" y="148" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">frame 与 transform</text>
<text x="366" y="172" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">保存变换版本</text>
<rect x="670" y="90" width="260" height="105" rx="10" fill="#fff0d5" stroke="#9db8bf"/>
<text x="686" y="119" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">地图表达</text>
<text x="686" y="148" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">占据 / 自由 / 未知</text>
<text x="686" y="172" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">map 与 revision</text>
<rect x="670" y="310" width="260" height="105" rx="10" fill="#e4f1ef" stroke="#9db8bf"/>
<text x="686" y="339" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">语义与覆盖</text>
<text x="686" y="368" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">目标、区域、已观察点</text>
<text x="686" y="392" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">不能把预测当实测</text>
<rect x="350" y="310" width="260" height="105" rx="10" fill="#e8edf7" stroke="#9db8bf"/>
<text x="366" y="339" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">能力约束规划</text>
<text x="366" y="368" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">2D / 地形 / 3D</text>
<text x="366" y="392" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">净空、支撑和未知区</text>
<rect x="30" y="310" width="260" height="105" rx="10" fill="#fff0d5" stroke="#9db8bf"/>
<text x="46" y="339" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#173544">命令后再观察</text>
<text x="46" y="368" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">验证到达与地图一致</text>
<text x="46" y="392" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">旧地图不产生新证据</text>
<line x1="290" y1="142" x2="350" y2="142" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="320.0" y="100" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">配准</text>
<line x1="610" y1="142" x2="670" y2="142" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="640.0" y="100" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">融合</text>
<line x1="800" y1="195" x2="800" y2="310" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="800.0" y="254" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">解释</text>
<line x1="670" y1="362" x2="610" y2="362" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="640.0" y="320" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">查询</text>
<line x1="350" y1="362" x2="290" y2="362" stroke="#006f78" stroke-width="2" marker-end="url(#arrow)"/>
<text paint-order="stroke" stroke="#f4f7f7" stroke-width="6" stroke-linejoin="round" x="320.0" y="320" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#173544">复验</text>
<text x="30" y="466" font-family="sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#173544">语义回答“是什么”，几何与控制约束共同回答“能否去”。</text>
</svg>
